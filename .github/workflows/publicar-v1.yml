name: Publicar la versión de entrega
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-v1.yml']
jobs:
  publicar:
    if: github.event.before == '5eabcb95c33f8c3ca5da2439a70701aee504f5d7'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Publicar la release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: '5eabcb95c33f8c3ca5da2439a70701aee504f5d7'
        run: |
          cat > "$RUNNER_TEMP/notas-v1.md" <<'NOTAS'
          El comedero con ESP32 detecta movimiento y sirve una porción por activación del PIR.
          Esta versión incluye el firmware, el circuito de Wokwi, el esquema, la lista de materiales y las capturas de funcionamiento.
          NOTAS
          gh release create v1.0 --repo "$GH_REPO" --target "$REVISION" --title 'Versión de entrega' --notes-file "$RUNNER_TEMP/notas-v1.md"
